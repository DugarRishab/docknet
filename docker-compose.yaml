version: "3.8"

networks:
  docknet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24  # changing this subnet is fine, but must match the one in the worker template, central and dashboard & in dockerfile of worker

volumes:
  program-files: {}     # shared upload area

services:
  docknet-central:
    build:
      context: ./central
      dockerfile: Dockerfile
    image: central:latest
    container_name: docknet-central
    networks:
      docknet:
        ipv4_address: 172.25.0.10
    environment:
      - PORT=8000
      - NODE_ENV=production
      - DATA_ROOT=/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./central/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"

  docknet-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://172.25.0.10:8000
        VITE_WS_URL: ws://172.25.0.10:8000
    image: dashboard:latest
    container_name: docknet-dashboard
    networks:
      docknet:
        ipv4_address: 172.25.0.20
    volumes:
      - program-files:/mnt/uploads
    ports:
      - "3000:80"
    depends_on:
      - docknet-central

  # docknet-worker:
  #   image: docknet/worker:latest     # your tangle-sg + monitoring plugin image
  #   networks:
  #     docknet:
  #       # note: each replica gets a dynamic IP in the 172.25.0.0/24 range
  #   volumes:
  #     - program-files:/app/program    # your uploaded binary in /app/program
  #   environment:
  #     - CENTRAL_WS=ws://172.25.0.10:4000/worker
  #     - NODE_ID=${NODE_ID}            # passed in by Compose
  #     - GENESIS_ID=${GENESIS_ID}      # if you’re injecting it via ENV
  #   deploy:
  #     replicas: 20                    # or any number the user picks
  #     restart_policy:
  #       condition: on-failure

  docknet-worker-template:
    # purely to build the worker image
    build:
      context: ./worker
      dockerfile: Dockerfile
      args:
        BASE_IP: ${BASE_IP:-172.25.0.1}
    image: docknet/worker:latest
    networks:
      - docknet
    environment:
      BASE_IP: ${BASE_IP:-172.25.0.1}
    # no real container run—just build the image
    entrypoint: ["/bin/true"]
